
name: Blackview A80 Pro Kernel CI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build MT6757CD Kernel 4.4
    runs-on: ubuntu-latest

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/bib56717-eng/android_kernel_mediatek_mt6757CD-4.4
          kernel-branch: oreo-8.1
          config: blackview_defconfig
          arch: arm64
          anykernel3: true
          aosp-gcc: false
        

          other-gcc64-url: https://github.com/KudProject/aarch64-linux-android-4.9
          other-gcc32-url: https://github.com/KudProject/aarch64-linux-android-4.9

          android-version: 8.1
