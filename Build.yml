
name: Blackview A80 Pro Kernel CI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build MT6757CD Kernel 4.4
    runs-on: ubuntu-20.04

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/bib56717-eng/android_kernel_mediatek_mt6757CD-4.4
          branch: oreo-8.1
          config: blackview_defconfig
          arch: arm64
          aosp-gcc: true
          anykernel3: true
          python-2.7: true
        
